[platformio]
default_envs = tdisplay
data_dir = data

[env:tdisplay]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = no
build_src_filter = +<../lib/vpet_core/src/vpet/Input.cpp>
build_flags = -std=gnu++17
